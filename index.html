<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>傻吊 ID 生成器</title>
<meta name="description" content="硬编码词库 + 纯随机抽取，给你一个不正经的 ID。">
<meta name="theme-color" content="#131314">
<meta property="og:title" content="傻吊 ID 生成器">
<meta property="og:description" content="硬编码词库 + 纯随机抽取，给你一个不正经的 ID。">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.67.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2.4"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M3.5 8.5H17"/><path d="M13.5 5 17 8.5 13.5 12"/><path d="M20.5 15.5H7"/><path d="M10.5 12 7 15.5l3.5 3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></symbol>
</svg>

<header class="appbar">
  <div class="appbar__left">
    <button class="icon-btn" id="btnMenu" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="drawer">
      <svg class="icon"><use href="#i-menu"/></svg>
    </button>
    <button class="brand" id="clownLogo" type="button" aria-label="捏捏小丑的鼻子">
      <svg class="clown" viewBox="0 0 64 64" aria-hidden="true">
        <g class="clown-hair">
          <circle cx="13.5" cy="27" r="6.5"/><circle cx="16.5" cy="19.5" r="5"/>
          <circle cx="50.5" cy="27" r="6.5"/><circle cx="47.5" cy="19.5" r="5"/>
        </g>
        <ellipse class="clown-head" cx="32" cy="34.5" rx="16" ry="15.5"/>
        <path class="clown-hat" d="M26.5 19.5 32 6.5l5.5 13"/>
        <circle class="clown-pompom" cx="32" cy="5.2" r="2.5"/>
        <g class="clown-eyes"><circle cx="26.2" cy="30.5" r="1.7"/><circle cx="37.8" cy="30.5" r="1.7"/></g>
        <circle class="clown-nose" cx="32" cy="37.5" r="5"/>
        <path class="clown-mouth" d="M25.5 44.5Q32 49.5 38.5 44.5"/>
        <g class="clown-arm">
          <path d="M12.5 55Q17 47 24.5 40.5"/>
          <circle cx="32" cy="37.5" r="4.9"/>
          <path class="clown-fingers" d="M27.6 35.7h8.8M27.6 39.3h8.8"/>
        </g>
      </svg>
      <span class="brand__name">傻吊 ID 生成器</span>
    </button>
  </div>
  <div class="appbar__right">
    <button class="icon-btn" id="btnTheme" type="button" aria-label="切换明暗主题"><svg class="icon"><use href="#i-moon"/></svg></button>
    <a class="icon-btn" href="https://github.com/baicaizhale/Stupid-ID-Gen" target="_blank" rel="noopener" aria-label="GitHub 仓库"><svg class="icon icon--fill"><use href="#i-github"/></svg></a>
  </div>
</header>

<main class="page">

  <nav class="chips" aria-label="ID 格式">
    <button class="chip is-active" data-format="fury" type="button">
      <svg class="icon"><use href="#i-smile"/></svg><span>心情流</span>
    </button>
    <button class="chip" data-format="act" type="button">
      <svg class="icon"><use href="#i-zap"/></svg><span>动作流</span>
    </button>
    <button class="chip" data-format="random" type="button">
      <svg class="icon"><use href="#i-shuffle"/></svg><span>我全都要</span>
    </button>
  </nav>

  <section class="struct">
    <div class="struct__left">
      <span class="struct__label">ID 结构</span>
      <div class="struct__formula" id="formula" aria-live="polite"></div>
    </div>
    <div class="struct__right">
      <button class="struct__swap" id="btnSwap" type="button" aria-label="换一种结构">
        <svg class="icon"><use href="#i-swap"/></svg>
      </button>
    </div>
  </section>

  <section class="panels">
    <div class="panel panel--outlined" id="resultPanel">
      <button class="idcard" id="btnResult" type="button" aria-label="重新生成一个 ID">
        <span class="idcard__text" id="resultText">点一下，摇一个 ID</span>
      </button>
      <div class="panel__corner panel__corner--right"><span class="count" id="charCount">(0)</span></div>
    </div>

    <div class="panel panel--filled" id="partsPanel">
      <div class="parts" id="parts">
        <span class="parts__placeholder" id="partsPlaceholder">拆解</span>
      </div>
      <div class="panel__corner panel__corner--right"><span class="count" id="partCount">(0)</span></div>
    </div>
  </section>

  <div class="feedback">
    <a href="https://github.com/baicaizhale/Stupid-ID-Gen/issues" target="_blank" rel="noopener">发送反馈</a>
  </div>

  <div class="actions">
    <button class="round" id="btnRoll" type="button">
      <span class="round__circle"><svg class="icon"><use href="#i-sync"/></svg></span>
      <span class="round__label">换一个</span>
    </button>
    <button class="round" id="btnCopy" type="button">
      <span class="round__circle"><svg class="icon"><use href="#i-copy"/></svg></span>
      <span class="round__label">复制</span>
    </button>
  </div>

  <section class="history" id="history">
    <div class="history__head">
      <h2 class="history__title">最近摇出来的</h2>
      <button class="text-btn" id="btnClearHistory" type="button"><svg class="icon"><use href="#i-trash"/></svg>清空</button>
    </div>
    <ul class="history__list" id="historyList"></ul>
  </section>

  <footer class="foot">
    <span>© 2026 <a href="https://github.com/baicaizhale" target="_blank" rel="noopener">baicaizhale</a> · MIT License</span>
    <span class="foot__sep">·</span>
    <a href="https://github.com/baicaizhale/Stupid-ID-Gen" target="_blank" rel="noopener">GitHub</a>
  </footer>
</main>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="菜单">
  <div class="drawer__head">
    <svg class="clown clown--static" viewBox="0 0 64 64" aria-hidden="true">
      <g class="clown-hair">
        <circle cx="13.5" cy="27" r="6.5"/><circle cx="16.5" cy="19.5" r="5"/>
        <circle cx="50.5" cy="27" r="6.5"/><circle cx="47.5" cy="19.5" r="5"/>
      </g>
      <ellipse class="clown-head" cx="32" cy="34.5" rx="16" ry="15.5"/>
      <path class="clown-hat" d="M26.5 19.5 32 6.5l5.5 13"/>
      <circle class="clown-pompom" cx="32" cy="5.2" r="2.5"/>
      <g class="clown-eyes"><circle cx="26.2" cy="30.5" r="1.7"/><circle cx="37.8" cy="30.5" r="1.7"/></g>
      <circle class="clown-nose" cx="32" cy="37.5" r="5"/>
      <path class="clown-mouth" d="M25.5 44.5Q32 49.5 38.5 44.5"/>
      <g class="clown-arm">
        <path d="M12.5 55Q17 47 24.5 40.5"/>
        <circle cx="32" cy="37.5" r="4.9"/>
        <path class="clown-fingers" d="M27.6 35.7h8.8M27.6 39.3h8.8"/>
      </g>
    </svg>
    <span class="drawer__title">傻吊 ID 生成器</span>
    <button class="icon-btn" id="btnDrawerClose" type="button" aria-label="关闭菜单"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <nav class="drawer__nav">
    <p class="drawer__section">格式</p>
    <button class="drawer__item" data-format="fury" type="button">
      <svg class="icon"><use href="#i-smile"/></svg>
      <span class="drawer__item-body"><b>格式一 · 心情流</b><small>心情 + 的 + 颜色 + 物品 + 5~6 位数字</small></span>
    </button>
    <button class="drawer__item" data-format="act" type="button">
      <svg class="icon"><use href="#i-zap"/></svg>
      <span class="drawer__item-body"><b>格式二 · 动作流</b><small>不及物动作 + 的 + 名词 + 及物动词 + 名词</small></span>
    </button>
    <button class="drawer__item" data-format="random" type="button">
      <svg class="icon"><use href="#i-shuffle"/></svg>
      <span class="drawer__item-body"><b>我全都要</b><small>每次随机从两种格式里抽一种</small></span>
    </button>
    <p class="drawer__section">关于</p>
    <p class="drawer__about">所有词条都硬编码在 <code>app.js</code> 里，生成过程就是闭眼乱抽，没有 AI、没有接口、没有后端。刷新即失忆，除了你本地那点历史记录。</p>
    <a class="drawer__item" href="https://github.com/baicaizhale/Stupid-ID-Gen" target="_blank" rel="noopener">
      <svg class="icon icon--fill"><use href="#i-github"/></svg>
      <span class="drawer__item-body"><b>GitHub 仓库</b><small>Star 一下，或者来提词库</small></span>
    </a>
    <a class="drawer__item" href="https://github.com/baicaizhale/Stupid-ID-Gen/issues" target="_blank" rel="noopener">
      <svg class="icon"><use href="#i-ext"/></svg>
      <span class="drawer__item-body"><b>提词 / 反馈</b><small>想把谁写进词库里，去开个 issue</small></span>
    </a>
  </nav>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
